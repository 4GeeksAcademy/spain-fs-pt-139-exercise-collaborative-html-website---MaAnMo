<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div>
        <div class="container my-5">
            <div class="row">
            <div class="col-12 col-lg-11 col-xl-11 mx-auto">
                <h2 class="fw-bold text-dark mb-2" style="font-size: 2rem;">Contact</h2>
                <p class="fs-5">
                    <small> Donec ullamcorper nulla non metus auctor fringilla. Vestibulum id
                        ligula porta felis euismod semper.
                        Praesent commodo cursus magna, vel scelerisque nisl consectetur. Fusce dapibus, tellus ac cursus
                        commodo. </small>
                </p>
            </div>
            <div class="d-flex justify-content-center ">
                <div class="card text-end d-flex justify-content-center" style="width: 50rem; ;">
                    <div class="card-body">
                        <div class="row g-0 text-center">
                            <div class="col-3 col-md-4 mb-4"><strong>Your E-mail</strong></div>
                            <div class="col-9 col-md-8">

                        </div>
                        <div class="row g-0 text-center">
                            <div class="col-4"><strong>Your message</strong> </div>
                            <div class="col-8 mb-4">
                                <textarea class="form-control" id="exampleFormControlTextarea1" rows="3"
                                    placeholder="Please enter your message here..."></textarea>
                            </div>
                            <a class="d-grid gap-2 d-md-flex justify-content-md-end "> Submit</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
